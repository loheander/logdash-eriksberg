[project]
name = "logdash"
version = "0.1.0"
description = "Interactive dashboard for analysing OpenStack logs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dash>=4.4.1",
    "dash-ag-grid>=35.3.0",
    "dash-mantine-components>=2.8.0",
    "drain3>=0.9.11",
    "duckdb>=1.5.6",
    "numpy>=2.5.4",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "zstandard>=0.25.0",
]

[project.scripts]
logdash = "logdash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logdash"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=logdash --cov-branch --cov-report=term-missing:skip-covered --cov-fail-under=90 -m 'not slow'"
markers = ["slow: benchmarks on the real data set (skipped by default)"]

[tool.coverage.run]
source = ["logdash"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
